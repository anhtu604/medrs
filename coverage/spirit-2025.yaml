items:
  - {id: '1a', section: 'Administrative information', topic: 'Title and structured summary', operational_prompt: 'Title stating the trial design, population, and interventions, with identification as a protocol', source_locator: 'bmj-2024-081660/checklist/item-1a'}
  - {id: '1b', section: 'Administrative information', topic: 'Title and structured summary', operational_prompt: 'Structured summary of trial design and methods, including items from the World Health Organization Trial Registration Data Set', source_locator: 'bmj-2024-081660/checklist/item-1b'}
  - {id: '2', section: 'Administrative information', topic: 'Protocol version', operational_prompt: 'Version date and identifier', source_locator: 'bmj-2024-081660/checklist/item-2'}
  - {id: '3a', section: 'Administrative information', topic: 'Roles and responsibilities', operational_prompt: 'Names, affiliations, and roles of protocol contributors', source_locator: 'bmj-2024-081660/checklist/item-3a'}
  - {id: '3b', section: 'Administrative information', topic: 'Roles and responsibilities', operational_prompt: 'Name and contact information for the trial sponsor', source_locator: 'bmj-2024-081660/checklist/item-3b'}
  - {id: '3c', section: 'Administrative information', topic: 'Roles and responsibilities', operational_prompt: 'Role of trial sponsor and funders in design, conduct, analysis, and reporting of trial; including any authority over these activities', source_locator: 'bmj-2024-081660/checklist/item-3c'}
  - {id: '3d', section: 'Administrative information', topic: 'Roles and responsibilities', operational_prompt: 'Composition, roles, and responsibilities of the coordinating site, steering committee, endpoint adjudication committee, data management team, and other individuals or groups overseeing the trial, if applicable', source_locator: 'bmj-2024-081660/checklist/item-3d'}
  - {id: '4', section: 'Open science', topic: 'Trial registration', operational_prompt: 'Name of trial registry, identifying number (with URL), and date of registration. If not yet registered, name of intended registry', source_locator: 'bmj-2024-081660/checklist/item-4'}
  - {id: '5', section: 'Open science', topic: 'Protocol and statistical analysis plan', operational_prompt: 'Where the trial protocol and statistical analysis plan can be accessed', source_locator: 'bmj-2024-081660/checklist/item-5'}
  - {id: '6', section: 'Open science', topic: 'Data sharing', operational_prompt: 'Where and how the individual de-identified participant data (including data dictionary), statistical code, and any other materials will be accessible', source_locator: 'bmj-2024-081660/checklist/item-6'}
  - {id: '7a', section: 'Open science', topic: 'Funding and conflicts of interest', operational_prompt: 'Sources of funding and other support (eg, supply of drugs)', source_locator: 'bmj-2024-081660/checklist/item-7a'}
  - {id: '7b', section: 'Open science', topic: 'Funding and conflicts of interest', operational_prompt: 'Financial and other conflicts of interest for principal investigators and steering committee members', source_locator: 'bmj-2024-081660/checklist/item-7b'}
  - {id: '8', section: 'Open science', topic: 'Dissemination policy', operational_prompt: 'Plans to communicate trial results to participants, healthcare professionals, the public, and other relevant groups (eg, reporting in trial registry, plain language summary, publication)', source_locator: 'bmj-2024-081660/checklist/item-8'}
  - {id: '9a', section: 'Introduction', topic: 'Background and rationale', operational_prompt: 'Scientific background and rationale, including summary of relevant studies (published and unpublished) examining benefits and harms for each intervention', source_locator: 'bmj-2024-081660/checklist/item-9a'}
  - {id: '9b', section: 'Introduction', topic: 'Background and rationale', operational_prompt: 'Explanation for choice of comparator', source_locator: 'bmj-2024-081660/checklist/item-9b'}
  - {id: '10', section: 'Introduction', topic: 'Objectives', operational_prompt: 'Specific objectives related to benefits and harms', source_locator: 'bmj-2024-081660/checklist/item-10'}
  - {id: '11', section: 'Methods: Patient and public involvement, trial design', topic: 'Patient and public involvement', operational_prompt: 'Details of, or plans for, patient or public involvement in the design, conduct, and reporting of the trial', source_locator: 'bmj-2024-081660/checklist/item-11'}
  - {id: '12', section: 'Methods: Patient and public involvement, trial design', topic: 'Trial design', operational_prompt: 'Description of trial design including type of trial (eg, parallel group, crossover), allocation ratio, and framework (eg, superiority, equivalence, non-inferiority, exploratory)', source_locator: 'bmj-2024-081660/checklist/item-12'}
  - {id: '13', section: 'Methods: Participants, interventions, and outcomes', topic: 'Trial setting', operational_prompt: 'Settings (eg, community, hospital) and locations (eg, countries, sites) where the trial will be conducted', source_locator: 'bmj-2024-081660/checklist/item-13'}
  - {id: '14a', section: 'Methods: Participants, interventions, and outcomes', topic: 'Eligibility criteria', operational_prompt: 'Eligibility criteria for participants', source_locator: 'bmj-2024-081660/checklist/item-14a'}
  - {id: '14b', section: 'Methods: Participants, interventions, and outcomes', topic: 'Eligibility criteria', operational_prompt: 'If applicable, eligibility criteria for sites and for individuals who will deliver the interventions (eg, surgeons, physiotherapists)', source_locator: 'bmj-2024-081660/checklist/item-14b'}
  - {id: '15a', section: 'Methods: Participants, interventions, and outcomes', topic: 'Intervention and comparator', operational_prompt: 'Intervention and comparator with sufficient details to allow replication including how, when, and by whom they will be administered. If relevant, where additional materials describing the intervention and comparator (eg, intervention manual) can be accessed', source_locator: 'bmj-2024-081660/checklist/item-15a'}
  - {id: '15b', section: 'Methods: Participants, interventions, and outcomes', topic: 'Intervention and comparator', operational_prompt: 'Criteria for discontinuing or modifying allocated intervention/comparator for a trial participant (eg, drug dose change in response to harms, participant request, or improving/worsening disease)', source_locator: 'bmj-2024-081660/checklist/item-15b'}
  - {id: '15c', section: 'Methods: Participants, interventions, and outcomes', topic: 'Intervention and comparator', operational_prompt: 'Strategies to improve adherence to intervention/comparator protocols, if applicable, and any procedures for monitoring adherence (eg, drug tablet return, sessions attended)', source_locator: 'bmj-2024-081660/checklist/item-15c'}
  - {id: '15d', section: 'Methods: Participants, interventions, and outcomes', topic: 'Intervention and comparator', operational_prompt: 'Concomitant care that is permitted or prohibited during the trial', source_locator: 'bmj-2024-081660/checklist/item-15d'}
  - {id: '16', section: 'Methods: Participants, interventions, and outcomes', topic: 'Outcomes', operational_prompt: 'Primary and secondary outcomes, including the specific measurement variable (eg, systolic blood pressure), analysis metric (eg, change from baseline, final value, time to event), method of aggregation (eg, median, proportion), and time point for each outcome', source_locator: 'bmj-2024-081660/checklist/item-16'}
  - {id: '17', section: 'Methods: Participants, interventions, and outcomes', topic: 'Harms', operational_prompt: 'How harms are defined and will be assessed (eg, systematically, non-systematically)', source_locator: 'bmj-2024-081660/checklist/item-17'}
  - {id: '18', section: 'Methods: Participants, interventions, and outcomes', topic: 'Participant timeline', operational_prompt: 'Time schedule of enrolment, interventions (including any run-ins and washouts), assessments, and visits for participants. A schematic diagram is highly recommended (see fig 1)', source_locator: 'bmj-2024-081660/checklist/item-18'}
  - {id: '19', section: 'Methods: Participants, interventions, and outcomes', topic: 'Sample size', operational_prompt: 'How sample size was determined, including all assumptions supporting the sample size calculation', source_locator: 'bmj-2024-081660/checklist/item-19'}
  - {id: '20', section: 'Methods: Participants, interventions, and outcomes', topic: 'Recruitment', operational_prompt: 'Strategies for achieving adequate participant enrolment to reach target sample size', source_locator: 'bmj-2024-081660/checklist/item-20'}
  - {id: '21a', section: 'Randomisation:', topic: 'Sequence generation', operational_prompt: 'Who will generate the random allocation sequence and the method used', source_locator: 'bmj-2024-081660/checklist/item-21a'}
  - {id: '21b', section: 'Randomisation:', topic: 'Sequence generation', operational_prompt: 'Type of randomisation (simple or restricted) and details of any factors for stratification. To reduce predictability of a random sequence, other details of any planned restriction (eg, blocking) should be provided in a separate document that is unavailable to those who enrol participants or assign interventions', source_locator: 'bmj-2024-081660/checklist/item-21b'}
  - {id: '22', section: 'Randomisation:', topic: 'Allocation concealment mechanism', operational_prompt: 'Mechanism used to implement the random allocation sequence (eg, central computer/telephone; sequentially numbered, opaque, sealed containers), describing any steps to conceal the sequence until interventions are assigned', source_locator: 'bmj-2024-081660/checklist/item-22'}
  - {id: '23', section: 'Randomisation:', topic: 'Implementation', operational_prompt: 'Whether the personnel who will enrol and those who will assign participants to the interventions will have access to the random allocation sequence', source_locator: 'bmj-2024-081660/checklist/item-23'}
  - {id: '24a', section: 'Randomisation:', topic: 'Blinding', operational_prompt: 'Who will be blinded after assignment to interventions (eg, participants, care providers, outcome assessors, data analysts)', source_locator: 'bmj-2024-081660/checklist/item-24a'}
  - {id: '24b', section: 'Randomisation:', topic: 'Blinding', operational_prompt: 'If blinded, how blinding will be achieved and description of the similarity of interventions', source_locator: 'bmj-2024-081660/checklist/item-24b'}
  - {id: '24c', section: 'Randomisation:', topic: 'Blinding', operational_prompt: 'If blinded, circumstances under which unblinding is permissible, and procedure for revealing a participant’s allocated intervention during the trial', source_locator: 'bmj-2024-081660/checklist/item-24c'}
  - {id: '25a', section: 'Methods: Data collection, management, and analysis', topic: 'Data collection methods', operational_prompt: 'Plans for assessment and collection of trial data, including any related processes to promote data quality (eg, duplicate measurements, training of assessors) and a description of trial instruments (eg, questionnaires, laboratory tests) along with their reliability and validity, if known. Reference to where data collection forms can be accessed, if not in the protocol', source_locator: 'bmj-2024-081660/checklist/item-25a'}
  - {id: '25b', section: 'Methods: Data collection, management, and analysis', topic: 'Data collection methods', operational_prompt: 'Plans to promote participant retention and complete follow-up, including list of any outcome data to be collected for participants who discontinue or deviate from intervention protocols', source_locator: 'bmj-2024-081660/checklist/item-25b'}
  - {id: '26', section: 'Methods: Data collection, management, and analysis', topic: 'Data management', operational_prompt: 'Plans for data entry, coding, security, and storage, including any related processes to promote data quality (eg, double data entry; range checks for data values). Reference to where details of data management procedures can be accessed, if not in the protocol', source_locator: 'bmj-2024-081660/checklist/item-26'}
  - {id: '27a', section: 'Methods: Data collection, management, and analysis', topic: 'Statistical methods', operational_prompt: 'Statistical methods used to compare groups for primary and secondary outcomes, including harms', source_locator: 'bmj-2024-081660/checklist/item-27a'}
  - {id: '27b', section: 'Methods: Data collection, management, and analysis', topic: 'Statistical methods', operational_prompt: 'Definition of who will be included in each analysis (eg, all randomised participants), and in which group', source_locator: 'bmj-2024-081660/checklist/item-27b'}
  - {id: '27c', section: 'Methods: Data collection, management, and analysis', topic: 'Statistical methods', operational_prompt: 'How missing data will be handled in the analysis', source_locator: 'bmj-2024-081660/checklist/item-27c'}
  - {id: '27d', section: 'Methods: Data collection, management, and analysis', topic: 'Statistical methods', operational_prompt: 'Methods for any additional analyses (eg, subgroup and sensitivity analyses)', source_locator: 'bmj-2024-081660/checklist/item-27d'}
  - {id: '28a', section: 'Methods: Monitoring', topic: 'Data monitoring committee', operational_prompt: 'Composition of data monitoring committee (DMC); summary of its role and reporting structure; statement of whether it is independent from the sponsor and funder; conflicts of interest and reference to where further details about its charter can be found, if not in the protocol. Alternatively, an explanation of why a DMC is not needed', source_locator: 'bmj-2024-081660/checklist/item-28a'}
  - {id: '28b', section: 'Methods: Monitoring', topic: 'Data monitoring committee', operational_prompt: 'Explanation of any interim analyses and stopping guidelines, including who will have access to these interim results and make the final decision to terminate the trial', source_locator: 'bmj-2024-081660/checklist/item-28b'}
  - {id: '29', section: 'Methods: Monitoring', topic: 'Trial monitoring', operational_prompt: 'Frequency and procedures for monitoring trial conduct. If there is no monitoring, give explanation', source_locator: 'bmj-2024-081660/checklist/item-29'}
  - {id: '30', section: 'Ethics', topic: 'Research ethics approval', operational_prompt: 'Plans for seeking research ethics committee/institutional review board approval', source_locator: 'bmj-2024-081660/checklist/item-30'}
  - {id: '31', section: 'Ethics', topic: 'Protocol amendments', operational_prompt: 'Plans for communicating important protocol modifications to relevant parties', source_locator: 'bmj-2024-081660/checklist/item-31'}
  - {id: '32a', section: 'Ethics', topic: 'Consent or assent', operational_prompt: 'Who will obtain informed consent or assent from potential trial participants or authorised proxies, and how', source_locator: 'bmj-2024-081660/checklist/item-32a'}
  - {id: '32b', section: 'Ethics', topic: 'Consent or assent', operational_prompt: 'Additional consent provisions for collection and use of participant data and biological specimens in ancillary studies, if applicable', source_locator: 'bmj-2024-081660/checklist/item-32b'}
  - {id: '33', section: 'Ethics', topic: 'Confidentiality', operational_prompt: 'How personal information about potential and enrolled participants will be collected, shared, and maintained in order to protect confidentiality before, during, and after the trial', source_locator: 'bmj-2024-081660/checklist/item-33'}
  - {id: '34', section: 'Ethics', topic: 'Ancillary and post-trial care', operational_prompt: 'Provisions, if any, for ancillary and post-trial care, and for compensation to those who suffer harm from trial participation', source_locator: 'bmj-2024-081660/checklist/item-34'}
