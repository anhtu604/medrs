items:
  - {id: '1', section: 'Title', topic: 'Title', applies_to: 'D;E', operational_prompt: 'Identify the study as developing or evaluating the performance of a multivariable prediction model, the target population, and the outcome to be predicted', source_locator: 'bmj-2023-078378/checklist/item-1'}
  - {id: '2', section: 'Abstract', topic: 'Abstract', applies_to: 'D;E', operational_prompt: 'See TRIPOD+AI for Abstracts checklist', source_locator: 'bmj-2023-078378/checklist/item-2'}
  - {id: '3a', section: 'Introduction', topic: 'Background', applies_to: 'D;E', operational_prompt: 'Explain the healthcare context (including whether diagnostic or prognostic) and rationale for developing or evaluating the prediction model, including references to existing models', source_locator: 'bmj-2023-078378/checklist/item-3a'}
  - {id: '3b', section: 'Introduction', topic: 'Background', applies_to: 'D;E', operational_prompt: 'Describe the target population and the intended purpose of the prediction model in the context of the care pathway, including its intended users (eg, healthcare professionals, patients, public)', source_locator: 'bmj-2023-078378/checklist/item-3b'}
  - {id: '3c', section: 'Introduction', topic: 'Background', applies_to: 'D;E', operational_prompt: 'Describe any known health inequalities between sociodemographic groups', source_locator: 'bmj-2023-078378/checklist/item-3c'}
  - {id: '4', section: 'Introduction', topic: 'Objectives', applies_to: 'D;E', operational_prompt: 'Specify the study objectives, including whether the study describes the development or validation of a prediction model (or both)', source_locator: 'bmj-2023-078378/checklist/item-4'}
  - {id: '5a', section: 'Methods', topic: 'Data', applies_to: 'D;E', operational_prompt: 'Describe the sources of data separately for the development and evaluation datasets (eg, randomised trial, cohort, routine care or registry data), the rationale for using these data, and representativeness of the data', source_locator: 'bmj-2023-078378/checklist/item-5a'}
  - {id: '5b', section: 'Methods', topic: 'Data', applies_to: 'D;E', operational_prompt: 'Specify the dates of the collected participant data, including start and end of participant accrual; and, if applicable, end of follow-up', source_locator: 'bmj-2023-078378/checklist/item-5b'}
  - {id: '6a', section: 'Methods', topic: 'Participants', applies_to: 'D;E', operational_prompt: 'Specify key elements of the study setting (eg, primary care, secondary care, general population) including the number and location of centres', source_locator: 'bmj-2023-078378/checklist/item-6a'}
  - {id: '6b', section: 'Methods', topic: 'Participants', applies_to: 'D;E', operational_prompt: 'Describe the eligibility criteria for study participants', source_locator: 'bmj-2023-078378/checklist/item-6b'}
  - {id: '6c', section: 'Methods', topic: 'Participants', applies_to: 'D;E', operational_prompt: 'Give details of any treatments received, and how they were handled during model development or evaluation, if relevant', source_locator: 'bmj-2023-078378/checklist/item-6c'}
  - {id: '7', section: 'Methods', topic: 'Data preparation', applies_to: 'D;E', operational_prompt: 'Describe any data pre-processing and quality checking, including whether this was similar across relevant sociodemographic groups', source_locator: 'bmj-2023-078378/checklist/item-7'}
  - {id: '8a', section: 'Methods', topic: 'Outcome', applies_to: 'D;E', operational_prompt: 'Clearly define the outcome that is being predicted and the time horizon, including how and when assessed, the rationale for choosing this outcome, and whether the method of outcome assessment is consistent across sociodemographic groups', source_locator: 'bmj-2023-078378/checklist/item-8a'}
  - {id: '8b', section: 'Methods', topic: 'Outcome', applies_to: 'D;E', operational_prompt: 'If outcome assessment requires subjective interpretation, describe the qualifications and demographic characteristics of the outcome assessors', source_locator: 'bmj-2023-078378/checklist/item-8b'}
  - {id: '8c', section: 'Methods', topic: 'Outcome', applies_to: 'D;E', operational_prompt: 'Report any actions to blind assessment of the outcome to be predicted', source_locator: 'bmj-2023-078378/checklist/item-8c'}
  - {id: '9a', section: 'Methods', topic: 'Predictors', applies_to: 'D', operational_prompt: 'Describe the choice of initial predictors (eg, literature, previous models, all available predictors) and any pre-selection of predictors before model building', source_locator: 'bmj-2023-078378/checklist/item-9a'}
  - {id: '9b', section: 'Methods', topic: 'Predictors', applies_to: 'D;E', operational_prompt: 'Clearly define all predictors, including how and when they were measured (and any actions to blind assessment of predictors for the outcome and other predictors)', source_locator: 'bmj-2023-078378/checklist/item-9b'}
  - {id: '9c', section: 'Methods', topic: 'Predictors', applies_to: 'D;E', operational_prompt: 'If predictor measurement requires subjective interpretation, describe the qualifications and demographic characteristics of the predictor assessors', source_locator: 'bmj-2023-078378/checklist/item-9c'}
  - {id: '10', section: 'Methods', topic: 'Sample size', applies_to: 'D;E', operational_prompt: 'Explain how the study size was arrived at (separately for development and evaluation), and justify that the study size was sufficient to answer the research question. Include details of any sample size calculation', source_locator: 'bmj-2023-078378/checklist/item-10'}
  - {id: '11', section: 'Methods', topic: 'Missing data', applies_to: 'D;E', operational_prompt: 'Describe how missing data were handled. Provide reasons for omitting any data', source_locator: 'bmj-2023-078378/checklist/item-11'}
  - {id: '12a', section: 'Methods', topic: 'Analytical methods', applies_to: 'D', operational_prompt: 'Describe how the data were used (eg, for development and evaluation of model performance) in the analysis, including whether the data were partitioned, considering any sample size requirements', source_locator: 'bmj-2023-078378/checklist/item-12a'}
  - {id: '12b', section: 'Methods', topic: 'Analytical methods', applies_to: 'D', operational_prompt: 'Depending on the type of model, describe how predictors were handled in the analyses (functional form, rescaling, transformation, or any standardisation)', source_locator: 'bmj-2023-078378/checklist/item-12b'}
  - {id: '12c', section: 'Methods', topic: 'Analytical methods', applies_to: 'D', operational_prompt: 'Specify the type of model, rationale†, all model building steps, including any hyperparameter tuning, and method for internal validation', source_locator: 'bmj-2023-078378/checklist/item-12c'}
  - {id: '12d', section: 'Methods', topic: 'Analytical methods', applies_to: 'D;E', operational_prompt: 'Describe if and how any heterogeneity in estimates of model parameter values and model performance was handled and quantified across clusters (eg, hospitals, countries). See TRIPOD-Cluster for additional considerations‡', source_locator: 'bmj-2023-078378/checklist/item-12d'}
  - {id: '12e', section: 'Methods', topic: 'Analytical methods', applies_to: 'D;E', operational_prompt: 'Specify all measures and plots used (and their rationale) to evaluate model performance (eg, discrimination, calibration, clinical utility) and, if relevant, to compare multiple models', source_locator: 'bmj-2023-078378/checklist/item-12e'}
  - {id: '12f', section: 'Methods', topic: 'Analytical methods', applies_to: 'E', operational_prompt: 'Describe any model updating (eg, recalibration) arising from the model evaluation, either overall or for particular sociodemographic groups or settings', source_locator: 'bmj-2023-078378/checklist/item-12f'}
  - {id: '12g', section: 'Methods', topic: 'Analytical methods', applies_to: 'E', operational_prompt: 'For model evaluation, describe how the model predictions were calculated (eg, formula, code, object, application programming interface)', source_locator: 'bmj-2023-078378/checklist/item-12g'}
  - {id: '13', section: 'Methods', topic: 'Class imbalance', applies_to: 'D;E', operational_prompt: 'If class imbalance methods were used, state why and how this was done, and any subsequent methods to recalibrate the model or the model predictions', source_locator: 'bmj-2023-078378/checklist/item-13'}
  - {id: '14', section: 'Methods', topic: 'Fairness', applies_to: 'D;E', operational_prompt: 'Describe any approaches that were used to address model fairness and their rationale', source_locator: 'bmj-2023-078378/checklist/item-14'}
  - {id: '15', section: 'Methods', topic: 'Model output', applies_to: 'D', operational_prompt: 'Specify the output of the prediction model (eg, probabilities, classification). Provide details and rationale for any classification and how the thresholds were identified', source_locator: 'bmj-2023-078378/checklist/item-15'}
  - {id: '16', section: 'Methods', topic: 'Training versus evaluation', applies_to: 'D;E', operational_prompt: 'Identify any differences between the development and evaluation data in healthcare setting, eligibility criteria, outcome, and predictors', source_locator: 'bmj-2023-078378/checklist/item-16'}
  - {id: '17', section: 'Methods', topic: 'Ethical approval', applies_to: 'D;E', operational_prompt: 'Name the institutional research board or ethics committee that approved the study and describe the participant informed consent or the ethics committee waiver of informed consent', source_locator: 'bmj-2023-078378/checklist/item-17'}
  - {id: '18a', section: 'Open science', topic: 'Funding', applies_to: 'D;E', operational_prompt: 'Give the source of funding and the role of the funders for the present study', source_locator: 'bmj-2023-078378/checklist/item-18a'}
  - {id: '18b', section: 'Open science', topic: 'Conflicts of interest', applies_to: 'D;E', operational_prompt: 'Declare any conflicts of interest and financial disclosures for all authors', source_locator: 'bmj-2023-078378/checklist/item-18b'}
  - {id: '18c', section: 'Open science', topic: 'Protocol', applies_to: 'D;E', operational_prompt: 'Indicate where the study protocol can be accessed or state that a protocol was not prepared', source_locator: 'bmj-2023-078378/checklist/item-18c'}
  - {id: '18d', section: 'Open science', topic: 'Registration', applies_to: 'D;E', operational_prompt: 'Provide registration information for the study, including register name and registration number, or state that the study was not registered', source_locator: 'bmj-2023-078378/checklist/item-18d'}
  - {id: '18e', section: 'Open science', topic: 'Data sharing', applies_to: 'D;E', operational_prompt: 'Provide details of the availability of the study data', source_locator: 'bmj-2023-078378/checklist/item-18e'}
  - {id: '18f', section: 'Open science', topic: 'Code sharing', applies_to: 'D;E', operational_prompt: 'Provide details of the availability of the analytical code§', source_locator: 'bmj-2023-078378/checklist/item-18f'}
  - {id: '19', section: 'Patient and public involvement', topic: 'Patient and public involvement', applies_to: 'D;E', operational_prompt: 'Provide details of any patient and public involvement during the design, conduct, reporting, interpretation, or dissemination of the study or state no involvement', source_locator: 'bmj-2023-078378/checklist/item-19'}
  - {id: '20a', section: 'Result', topic: 'Participants', applies_to: 'D;E', operational_prompt: 'Describe the flow of participants through the study, including the number of participants with and without the outcome and, if applicable, a summary of the follow-up time. A diagram may be helpful', source_locator: 'bmj-2023-078378/checklist/item-20a'}
  - {id: '20b', section: 'Result', topic: 'Participants', applies_to: 'D;E', operational_prompt: 'Report the characteristics overall and, where applicable, for each data source or setting, including the key dates, key predictors (including demographics), treatments received, sample size, number of outcome events, follow-up time, and amount of missing data. A table may be helpful. Report any differences across key demographic groups', source_locator: 'bmj-2023-078378/checklist/item-20b'}
  - {id: '20c', section: 'Result', topic: 'Participants', applies_to: 'E', operational_prompt: 'For model evaluation, show a comparison with the development data of the distribution of important predictors (demographics, predictors, and outcome)', source_locator: 'bmj-2023-078378/checklist/item-20c'}
  - {id: '21', section: 'Result', topic: 'Model development', applies_to: 'D;E', operational_prompt: 'Specify the number of participants and outcome events in each analysis (eg, for model development, hyperparameter tuning, model evaluation)', source_locator: 'bmj-2023-078378/checklist/item-21'}
  - {id: '22', section: 'Result', topic: 'Model specification', applies_to: 'D', operational_prompt: 'Provide details of the full prediction model (eg, formula, code, object, application programming interface) to allow predictions in new individuals and to enable third party evaluation and implementation, including any restrictions to access or reuse (eg, freely available, proprietary)¶', source_locator: 'bmj-2023-078378/checklist/item-22'}
  - {id: '23a', section: 'Result', topic: 'Model performance', applies_to: 'D;E', operational_prompt: 'Report model performance estimates with confidence intervals, including for any key subgroups (eg, sociodemographic). Consider plots to aid presentation', source_locator: 'bmj-2023-078378/checklist/item-23a'}
  - {id: '23b', section: 'Result', topic: 'Model performance', applies_to: 'D;E', operational_prompt: 'If examined, report results of any heterogeneity in model performance across clusters. See TRIPOD-Cluster for additional details‡', source_locator: 'bmj-2023-078378/checklist/item-23b'}
  - {id: '24', section: 'Result', topic: 'Model updating', applies_to: 'E', operational_prompt: 'Report the results from any model updating, including the updated model and subsequent performance', source_locator: 'bmj-2023-078378/checklist/item-24'}
  - {id: '25', section: 'Discussion', topic: 'Interpretation', applies_to: 'D;E', operational_prompt: 'Give an overall interpretation of the main results, including issues of fairness in the context of the objectives and previous studies', source_locator: 'bmj-2023-078378/checklist/item-25'}
  - {id: '26', section: 'Discussion', topic: 'Limitations', applies_to: 'D;E', operational_prompt: 'Discuss any limitations of the study (such as a non-representative sample, sample size, overfitting, missing data) and their effects on any biases, statistical uncertainty, and generalisability', source_locator: 'bmj-2023-078378/checklist/item-26'}
  - {id: '27a', section: 'Discussion', topic: 'Usability of the model in the context of current care', applies_to: 'D', operational_prompt: 'Describe how poor quality or unavailable input data (eg, predictor values) should be assessed and handled when implementing the prediction model', source_locator: 'bmj-2023-078378/checklist/item-27a'}
  - {id: '27b', section: 'Discussion', topic: 'Usability of the model in the context of current care', applies_to: 'D', operational_prompt: 'Specify whether users will be required to interact in the handling of the input data or use of the model, and what level of expertise is required of users', source_locator: 'bmj-2023-078378/checklist/item-27b'}
  - {id: '27c', section: 'Discussion', topic: 'Usability of the model in the context of current care', applies_to: 'D;E', operational_prompt: 'Discuss any next steps for future research, with a specific view to applicability and generalisability of the model', source_locator: 'bmj-2023-078378/checklist/item-27c'}
