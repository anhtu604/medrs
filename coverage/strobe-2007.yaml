items:
  - {id: '1a', section: '', topic: 'TITLE and ABSTRACT', operational_prompt: 'Indicate the study''s design with a commonly used term in the title or the abstract', source_locator: 'journal.pmed.0040296/checklist/item-1a'}
  - {id: '1b', section: '', topic: 'TITLE and ABSTRACT', operational_prompt: 'Provide in the abstract an informative and balanced summary of what was done and what was found', source_locator: 'journal.pmed.0040296/checklist/item-1b'}
  - {id: '2', section: 'INTRODUCTION', topic: 'Background/ rationale', operational_prompt: 'Explain the scientific background and rationale for the investigation being reported', source_locator: 'journal.pmed.0040296/checklist/item-2'}
  - {id: '3', section: 'INTRODUCTION', topic: 'Objectives', operational_prompt: 'State specific objectives, including any prespecified hypotheses', source_locator: 'journal.pmed.0040296/checklist/item-3'}
  - {id: '4', section: 'METHODS', topic: 'Study design', operational_prompt: 'Present key elements of study design early in the paper', source_locator: 'journal.pmed.0040296/checklist/item-4'}
  - {id: '5', section: 'METHODS', topic: 'Setting', operational_prompt: 'Describe the setting, locations, and relevant dates, including periods of recruitment, exposure, follow-up, and data collection', source_locator: 'journal.pmed.0040296/checklist/item-5'}
  - {id: '6a', section: 'METHODS', topic: 'Participants', operational_prompt: 'Cohort study—Give the eligibility criteria, and the sources and methods of selection of participants. Describe methods of follow-up Case-control study—Give the eligibility criteria, and the sources and methods of case ascertainment and control selection. Give the rationale for the choice of cases and controls Cross-sectional study—Give the eligibility criteria, and the sources and methods of selection of participants', source_locator: 'journal.pmed.0040296/checklist/item-6a'}
  - {id: '6b', section: 'METHODS', topic: 'Participants', operational_prompt: 'Cohort study—For matched studies, give matching criteria and number of exposed and unexposed Case-control study—For matched studies, give matching criteria and the number of controls per case', source_locator: 'journal.pmed.0040296/checklist/item-6b'}
  - {id: '7', section: 'METHODS', topic: 'Variables', operational_prompt: 'Clearly define all outcomes, exposures, predictors, potential confounders, and effect modifiers. Give diagnostic criteria, if applicable', source_locator: 'journal.pmed.0040296/checklist/item-7'}
  - {id: '8', section: 'METHODS', topic: 'Data sources/ measurement', design_specific: true, operational_prompt: 'For each variable of interest, give sources of data and details of methods of assessment (measurement). Describe comparability of assessment methods if there is more than one group', source_locator: 'journal.pmed.0040296/checklist/item-8'}
  - {id: '9', section: 'METHODS', topic: 'Bias', operational_prompt: 'Describe any efforts to address potential sources of bias', source_locator: 'journal.pmed.0040296/checklist/item-9'}
  - {id: '10', section: 'METHODS', topic: 'Study size', operational_prompt: 'Explain how the study size was arrived at', source_locator: 'journal.pmed.0040296/checklist/item-10'}
  - {id: '11', section: 'METHODS', topic: 'Quantitative variables', operational_prompt: 'Explain how quantitative variables were handled in the analyses. If applicable, describe which groupings were chosen, and why', source_locator: 'journal.pmed.0040296/checklist/item-11'}
  - {id: '12a', section: 'METHODS', topic: 'Statistical methods', operational_prompt: 'Describe all statistical methods, including those used to control for confounding', source_locator: 'journal.pmed.0040296/checklist/item-12a'}
  - {id: '12b', section: 'METHODS', topic: 'Statistical methods', operational_prompt: 'Describe any methods used to examine subgroups and interactions', source_locator: 'journal.pmed.0040296/checklist/item-12b'}
  - {id: '12c', section: 'METHODS', topic: 'Statistical methods', operational_prompt: 'Explain how missing data were addressed', source_locator: 'journal.pmed.0040296/checklist/item-12c'}
  - {id: '12d', section: 'METHODS', topic: 'Statistical methods', operational_prompt: 'Cohort study—If applicable, explain how loss to follow-up was addressed Case-control study—If applicable, explain how matching of cases and controls was addressed Cross-sectional study—If applicable, describe analytical methods taking account of sampling strategy', source_locator: 'journal.pmed.0040296/checklist/item-12d'}
  - {id: '12e', section: 'METHODS', topic: 'Statistical methods', operational_prompt: 'Describe any sensitivity analyses', source_locator: 'journal.pmed.0040296/checklist/item-12e'}
  - {id: '13a', section: 'RESULTS', topic: 'Participants', design_specific: true, operational_prompt: 'Report the numbers of individuals at each stage of the study—e.g., numbers potentially eligible, examined for eligibility, confirmed eligible, included in the study, completing follow-up, and analysed', source_locator: 'journal.pmed.0040296/checklist/item-13a'}
  - {id: '13b', section: 'RESULTS', topic: 'Participants', design_specific: true, operational_prompt: 'Give reasons for non-participation at each stage', source_locator: 'journal.pmed.0040296/checklist/item-13b'}
  - {id: '13c', section: 'RESULTS', topic: 'Participants', design_specific: true, operational_prompt: 'Consider use of a flow diagram', source_locator: 'journal.pmed.0040296/checklist/item-13c'}
  - {id: '14a', section: 'RESULTS', topic: 'Descriptive data', design_specific: true, operational_prompt: 'Give characteristics of study participants (e.g., demographic, clinical, social) and information on exposures and potential confounders', source_locator: 'journal.pmed.0040296/checklist/item-14a'}
  - {id: '14b', section: 'RESULTS', topic: 'Descriptive data', design_specific: true, operational_prompt: 'Indicate the number of participants with missing data for each variable of interest', source_locator: 'journal.pmed.0040296/checklist/item-14b'}
  - {id: '14c', section: 'RESULTS', topic: 'Descriptive data', design_specific: true, operational_prompt: 'Cohort study—Summarise follow-up time (e.g., average and total amount)', source_locator: 'journal.pmed.0040296/checklist/item-14c'}
  - {id: '15', section: 'RESULTS', topic: 'Outcome data', design_specific: true, operational_prompt: 'Cohort study—Report numbers of outcome events or summary measures over time Case-control study—Report numbers in each exposure category, or summary measures of exposure Cross-sectional study—Report numbers of outcome events or summary measures', source_locator: 'journal.pmed.0040296/checklist/item-15'}
  - {id: '16a', section: 'RESULTS', topic: 'Main results', operational_prompt: 'Give unadjusted estimates and, if applicable, confounder-adjusted estimates and their precision (e.g., 95% confidence interval). Make clear which confounders were adjusted for and why they were included', source_locator: 'journal.pmed.0040296/checklist/item-16a'}
  - {id: '16b', section: 'RESULTS', topic: 'Main results', operational_prompt: 'Report category boundaries when continuous variables were categorized', source_locator: 'journal.pmed.0040296/checklist/item-16b'}
  - {id: '16c', section: 'RESULTS', topic: 'Main results', operational_prompt: 'If relevant, consider translating estimates of relative risk into absolute risk for a meaningful time period', source_locator: 'journal.pmed.0040296/checklist/item-16c'}
  - {id: '17', section: 'RESULTS', topic: 'Other analyses', operational_prompt: 'Report other analyses done—e.g., analyses of subgroups and interactions, and sensitivity analyses', source_locator: 'journal.pmed.0040296/checklist/item-17'}
  - {id: '18', section: 'DISCUSSION', topic: 'Key results', operational_prompt: 'Summarise key results with reference to study objectives', source_locator: 'journal.pmed.0040296/checklist/item-18'}
  - {id: '19', section: 'DISCUSSION', topic: 'Limitations', operational_prompt: 'Discuss limitations of the study, taking into account sources of potential bias or imprecision. Discuss both direction and magnitude of any potential bias', source_locator: 'journal.pmed.0040296/checklist/item-19'}
  - {id: '20', section: 'DISCUSSION', topic: 'Interpretation', operational_prompt: 'Give a cautious overall interpretation of results considering objectives, limitations, multiplicity of analyses, results from similar studies, and other relevant evidence', source_locator: 'journal.pmed.0040296/checklist/item-20'}
  - {id: '21', section: 'DISCUSSION', topic: 'Generalisability', operational_prompt: 'Discuss the generalisability (external validity) of the study results', source_locator: 'journal.pmed.0040296/checklist/item-21'}
  - {id: '22', section: 'OTHER INFORMATION', topic: 'Funding', operational_prompt: 'Give the source of funding and the role of the funders for the present study and, if applicable, for the original study on which the present article is based', source_locator: 'journal.pmed.0040296/checklist/item-22'}
