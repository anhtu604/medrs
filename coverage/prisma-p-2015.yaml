items:
  - {id: '1a', section: 'Title', topic: 'Identification', operational_prompt: 'Identify the report as a protocol of a systematic review', source_locator: '2046-4053-4-1/checklist/item-1a'}
  - {id: '1b', section: 'Title', topic: 'Update', operational_prompt: 'If the protocol is for an update of a previous systematic review, identify as such', source_locator: '2046-4053-4-1/checklist/item-1b'}
  - {id: '2', section: 'Title', topic: 'Registration', operational_prompt: 'If registered, provide the name of the registry (e.g., PROSPERO) and registration number', source_locator: '2046-4053-4-1/checklist/item-2'}
  - {id: '3a', section: 'Authors', topic: 'Contact', operational_prompt: 'Provide name, institutional affiliation, and e-mail address of all protocol authors; provide physical mailing address of corresponding author', source_locator: '2046-4053-4-1/checklist/item-3a'}
  - {id: '3b', section: 'Authors', topic: 'Contributions', operational_prompt: 'Describe contributions of protocol authors and identify the guarantor of the review', source_locator: '2046-4053-4-1/checklist/item-3b'}
  - {id: '4', section: 'Authors', topic: 'Amendments', operational_prompt: 'If the protocol represents an amendment of a previously completed or published protocol, identify as such and list changes; otherwise, state plan for documenting important protocol amendments', source_locator: '2046-4053-4-1/checklist/item-4'}
  - {id: '5a', section: 'Support', topic: 'Sources', operational_prompt: 'Indicate sources of financial or other support for the review', source_locator: '2046-4053-4-1/checklist/item-5a'}
  - {id: '5b', section: 'Support', topic: 'Sponsor', operational_prompt: 'Provide name for the review funder and/or sponsor', source_locator: '2046-4053-4-1/checklist/item-5b'}
  - {id: '5c', section: 'Support', topic: 'Role of sponsor/funder', operational_prompt: 'Describe roles of funder(s), sponsor(s), and/or institution(s), if any, in developing the protocol', source_locator: '2046-4053-4-1/checklist/item-5c'}
  - {id: '6', section: 'INTRODUCTION', topic: 'Rationale', operational_prompt: 'Describe the rationale for the review in the context of what is already known', source_locator: '2046-4053-4-1/checklist/item-6'}
  - {id: '7', section: 'INTRODUCTION', topic: 'Objectives', operational_prompt: 'Provide an explicit statement of the question(s) the review will address with reference to participants, interventions, comparators, and outcomes (PICO)', source_locator: '2046-4053-4-1/checklist/item-7'}
  - {id: '8', section: 'METHODS', topic: 'Eligibility criteria', operational_prompt: 'Specify the study characteristics (e.g., PICO, study design, setting, time frame) and report characteristics (e.g., years considered, language, publication status) to be used as criteria for eligibility for the review', source_locator: '2046-4053-4-1/checklist/item-8'}
  - {id: '9', section: 'METHODS', topic: 'Information sources', operational_prompt: 'Describe all intended information sources (e.g., electronic databases, contact with study authors, trial registers, or other grey literature sources) with planned dates of coverage', source_locator: '2046-4053-4-1/checklist/item-9'}
  - {id: '10', section: 'METHODS', topic: 'Search strategy', operational_prompt: 'Present draft of search strategy to be used for at least one electronic database, including planned limits, such that it could be repeated', source_locator: '2046-4053-4-1/checklist/item-10'}
  - {id: '11a', section: 'Study records', topic: 'Data management', operational_prompt: 'Describe the mechanism(s) that will be used to manage records and data throughout the review', source_locator: '2046-4053-4-1/checklist/item-11a'}
  - {id: '11b', section: 'Study records', topic: 'Selection process', operational_prompt: 'State the process that will be used for selecting studies (e.g., two independent reviewers) through each phase of the review (i.e., screening, eligibility, and inclusion in meta-analysis)', source_locator: '2046-4053-4-1/checklist/item-11b'}
  - {id: '11c', section: 'Study records', topic: 'Data collection process', operational_prompt: 'Describe planned method of extracting data from reports (e.g., piloting forms, done independently, in duplicate), any processes for obtaining and confirming data from investigators', source_locator: '2046-4053-4-1/checklist/item-11c'}
  - {id: '12', section: 'Study records', topic: 'Data items', operational_prompt: 'List and define all variables for which data will be sought (e.g., PICO items, funding sources), any pre-planned data assumptions and simplifications', source_locator: '2046-4053-4-1/checklist/item-12'}
  - {id: '13', section: 'Study records', topic: 'Outcomes and prioritization', operational_prompt: 'List and define all outcomes for which data will be sought, including prioritization of main and additional outcomes, with rationale', source_locator: '2046-4053-4-1/checklist/item-13'}
  - {id: '14', section: 'Study records', topic: 'Risk of bias in individual studies', operational_prompt: 'Describe anticipated methods for assessing risk of bias of individual studies, including whether this will be done at the outcome or study level, or both; state how this information will be used in data synthesis', source_locator: '2046-4053-4-1/checklist/item-14'}
  - {id: '15a', section: 'Data', topic: 'Synthesis', operational_prompt: 'Describe criteria under which study data will be quantitatively synthesized', source_locator: '2046-4053-4-1/checklist/item-15a'}
  - {id: '15b', section: 'Data', topic: 'Synthesis', operational_prompt: 'If data are appropriate for quantitative synthesis, describe planned summary measures, methods of handling data, and methods of combining data from studies, including any planned exploration of consistency (e.g., I 2, Kendall’s tau)', source_locator: '2046-4053-4-1/checklist/item-15b'}
  - {id: '15c', section: 'Data', topic: 'Synthesis', operational_prompt: 'Describe any proposed additional analyses (e.g., sensitivity or subgroup analyses, meta-regression)', source_locator: '2046-4053-4-1/checklist/item-15c'}
  - {id: '15d', section: 'Data', topic: 'Synthesis', operational_prompt: 'If quantitative synthesis is not appropriate, describe the type of summary planned', source_locator: '2046-4053-4-1/checklist/item-15d'}
  - {id: '16', section: 'Data', topic: 'Meta-bias(es)', operational_prompt: 'Specify any planned assessment of meta-bias(es) (e.g., publication bias across studies, selective reporting within studies)', source_locator: '2046-4053-4-1/checklist/item-16'}
  - {id: '17', section: 'Data', topic: 'Confidence in cumulative evidence', operational_prompt: 'Describe how the strength of the body of evidence will be assessed (e.g., GRADE)', source_locator: '2046-4053-4-1/checklist/item-17'}
