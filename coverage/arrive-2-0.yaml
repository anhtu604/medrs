items:
  - {id: '1', section: 'ARRIVE Essential 10', topic: 'Study design', operational_prompt: 'For each experiment, provide brief details of study design including:a. The groups being compared, including control groups. If no control group has been used, the rationale should be stated.b. The experimental unit (e.g., a single animal, litter, or cage of animals).', source_locator: 'journal.pbio.3000410/checklist/item-1'}
  - {id: '2', section: 'ARRIVE Essential 10', topic: 'Sample size', operational_prompt: 'a. Specify the exact number of experimental units allocated to each group, and the total number in each experiment. Also indicate the total number of animals used.b. Explain how the sample size was decided. Provide details of any a priori sample size calculation, if done.', source_locator: 'journal.pbio.3000410/checklist/item-2'}
  - {id: '3', section: 'ARRIVE Essential 10', topic: 'Inclusion and exclusion criteria', operational_prompt: 'a. Describe any criteria used for including and excluding animals (or experimental units) during the experiment, and data points during the analysis. Specify if these criteria were established a priori. If no criteria were set, state this explicitly.b. For each experimental group, report any animals, experimental units, or data points not included in the analysis and explain why. If there were no exclusions, state so.c. For each analysis, report the exact value of n in each experimental group.', source_locator: 'journal.pbio.3000410/checklist/item-3'}
  - {id: '4', section: 'ARRIVE Essential 10', topic: 'Randomisation', operational_prompt: 'a. State whether randomisation was used to allocate experimental units to control and treatment groups. If done, provide the method used to generate the randomisation sequence.b. Describe the strategy used to minimise potential confounders such as the order of treatments and measurements, or animal/cage location. If confounders were not controlled, state this explicitly.', source_locator: 'journal.pbio.3000410/checklist/item-4'}
  - {id: '5', section: 'ARRIVE Essential 10', topic: 'Blinding', operational_prompt: 'Describe who was aware of the group allocation at the different stages of the experiment (during the allocation, the conduct of the experiment, the outcome assessment, and the data analysis).', source_locator: 'journal.pbio.3000410/checklist/item-5'}
  - {id: '6', section: 'ARRIVE Essential 10', topic: 'Outcome measures', operational_prompt: 'a. Clearly define all outcome measures assessed (e.g., cell death, molecular markers, or behavioural changes).b. For hypothesis-testing studies, specify the primary outcome measure, i.e., the outcome measure that was used to determine the sample size.', source_locator: 'journal.pbio.3000410/checklist/item-6'}
  - {id: '7', section: 'ARRIVE Essential 10', topic: 'Statistical methods', operational_prompt: 'a. Provide details of the statistical methods used for each analysis, including software used.b. Describe any methods used to assess whether the data met the assumptions of the statistical approach, and what was done if the assumptions were not met.', source_locator: 'journal.pbio.3000410/checklist/item-7'}
  - {id: '8', section: 'ARRIVE Essential 10', topic: 'Experimental animals', operational_prompt: 'a. Provide species-appropriate details of the animals used, including species, strain and substrain, sex, age or developmental stage, and, if relevant, weight.b. Provide further relevant information on the provenance of animals, health/immune status, genetic modification status, genotype, and any previous procedures.', source_locator: 'journal.pbio.3000410/checklist/item-8'}
  - {id: '9', section: 'ARRIVE Essential 10', topic: 'Experimental procedures', operational_prompt: 'For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including:a. What was done, how it was done, and what was used.b. When and how often.c. Where (including detail of any acclimatisation periods).d. Why (provide rationale for procedures).', source_locator: 'journal.pbio.3000410/checklist/item-9'}
  - {id: '10', section: 'ARRIVE Essential 10', topic: 'Results', operational_prompt: 'For each experiment conducted, including independent replications, report:a. Summary/descriptive statistics for each experimental group, with a measure of variability where applicable (e.g., mean and SD, or median and range).b. If applicable, the effect size with a confidence interval.', source_locator: 'journal.pbio.3000410/checklist/item-10'}
  - {id: '11', section: 'ARRIVE Recommended Set', topic: 'Abstract', operational_prompt: 'Provide an accurate summary of the research objectives, animal species, strain and sex, key methods, principal findings, and study conclusions.', source_locator: 'journal.pbio.3000410/checklist/item-11'}
  - {id: '12', section: 'ARRIVE Recommended Set', topic: 'Background', operational_prompt: 'a. Include sufficient scientific background to understand the rationale and context for the study, and explain the experimental approach.b. Explain how the animal species and model used address the scientific objectives and, where appropriate, the relevance to human biology.', source_locator: 'journal.pbio.3000410/checklist/item-12'}
  - {id: '13', section: 'ARRIVE Recommended Set', topic: 'Objectives', operational_prompt: 'Clearly describe the research question, research objectives and, where appropriate, specific hypotheses being tested.', source_locator: 'journal.pbio.3000410/checklist/item-13'}
  - {id: '14', section: 'ARRIVE Recommended Set', topic: 'Ethical statement', operational_prompt: 'Provide the name of the ethical review committee or equivalent that has approved the use of animals in this study, and any relevant licence or protocol numbers (if applicable). If ethical approval was not sought or granted, provide a justification.', source_locator: 'journal.pbio.3000410/checklist/item-14'}
  - {id: '15', section: 'ARRIVE Recommended Set', topic: 'Housing and husbandry', operational_prompt: 'Provide details of housing and husbandry conditions, including any environmental enrichment.', source_locator: 'journal.pbio.3000410/checklist/item-15'}
  - {id: '16', section: 'ARRIVE Recommended Set', topic: 'Animal care and monitoring', operational_prompt: 'a. Describe any interventions or steps taken in the experimental protocols to reduce pain, suffering, and distress.b. Report any expected or unexpected adverse events.c. Describe the humane endpoints established for the study, the signs that were monitored, and the frequency of monitoring. If the study did not have humane endpoints, state this.', source_locator: 'journal.pbio.3000410/checklist/item-16'}
  - {id: '17', section: 'ARRIVE Recommended Set', topic: 'Interpretation/scientific implications', operational_prompt: 'a. Interpret the results, taking into account the study objectives and hypotheses, current theory, and other relevant studies in the literature.b. Comment on the study limitations, including potential sources of bias, limitations of the animal model, and imprecision associated with the results.', source_locator: 'journal.pbio.3000410/checklist/item-17'}
  - {id: '18', section: 'ARRIVE Recommended Set', topic: 'Generalisability/translation', operational_prompt: 'Comment on whether, and how, the findings of this study are likely to generalise to other species or experimental conditions, including any relevance to human biology (where appropriate).', source_locator: 'journal.pbio.3000410/checklist/item-18'}
  - {id: '19', section: 'ARRIVE Recommended Set', topic: 'Protocol registration', operational_prompt: 'Provide a statement indicating whether a protocol (including the research question, key design features, and analysis plan) was prepared before the study, and if and where this protocol was registered.', source_locator: 'journal.pbio.3000410/checklist/item-19'}
  - {id: '20', section: 'ARRIVE Recommended Set', topic: 'Data access', operational_prompt: 'Provide a statement describing if and where study data are available.', source_locator: 'journal.pbio.3000410/checklist/item-20'}
  - {id: '21', section: 'ARRIVE Recommended Set', topic: 'Declaration of interests', operational_prompt: 'a. Declare any potential conflicts of interest, including financial and nonfinancial. If none exist, this should be stated.b. List all funding sources (including grant identifier) and the role of the funder(s) in the design, analysis, and reporting of the study.', source_locator: 'journal.pbio.3000410/checklist/item-21'}
