items:
  - {id: '1', section: 'Title', topic: 'Title', operational_prompt: 'Identify the report as a systematic review.', source_locator: 'bmj.n71/checklist/item-1'}
  - {id: '2', section: 'Abstract', topic: 'Abstract', operational_prompt: 'See the PRISMA 2020 for Abstracts checklist (table 2).', source_locator: 'bmj.n71/checklist/item-2'}
  - {id: '3', section: 'Introduction', topic: 'Rationale', operational_prompt: 'Describe the rationale for the review in the context of existing knowledge.', source_locator: 'bmj.n71/checklist/item-3'}
  - {id: '4', section: 'Introduction', topic: 'Objectives', operational_prompt: 'Provide an explicit statement of the objective(s) or question(s) the review addresses.', source_locator: 'bmj.n71/checklist/item-4'}
  - {id: '5', section: 'Methods', topic: 'Eligibility criteria', operational_prompt: 'Specify the inclusion and exclusion criteria for the review and how studies were grouped for the syntheses.', source_locator: 'bmj.n71/checklist/item-5'}
  - {id: '6', section: 'Methods', topic: 'Information sources', operational_prompt: 'Specify all databases, registers, websites, organisations, reference lists and other sources searched or consulted to identify studies. Specify the date when each source was last searched or consulted.', source_locator: 'bmj.n71/checklist/item-6'}
  - {id: '7', section: 'Methods', topic: 'Search strategy', operational_prompt: 'Present the full search strategies for all databases, registers and websites, including any filters and limits used.', source_locator: 'bmj.n71/checklist/item-7'}
  - {id: '8', section: 'Methods', topic: 'Selection process', operational_prompt: 'Specify the methods used to decide whether a study met the inclusion criteria of the review, including how many reviewers screened each record and each report retrieved, whether they worked independently, and if applicable, details of automation tools used in the process.', source_locator: 'bmj.n71/checklist/item-8'}
  - {id: '9', section: 'Methods', topic: 'Data collection process', operational_prompt: 'Specify the methods used to collect data from reports, including how many reviewers collected data from each report, whether they worked independently, any processes for obtaining or confirming data from study investigators, and if applicable, details of automation tools used in the process.', source_locator: 'bmj.n71/checklist/item-9'}
  - {id: '10a', section: 'Methods', topic: 'Data items', operational_prompt: 'List and define all outcomes for which data were sought. Specify whether all results that were compatible with each outcome domain in each study were sought (e.g. for all measures, time points, analyses), and if not, the methods used to decide which results to collect.', source_locator: 'bmj.n71/checklist/item-10a'}
  - {id: '10b', section: 'Methods', topic: 'Data items', operational_prompt: 'List and define all other variables for which data were sought (e.g. participant and intervention characteristics, funding sources). Describe any assumptions made about any missing or unclear information.', source_locator: 'bmj.n71/checklist/item-10b'}
  - {id: '11', section: 'Methods', topic: 'Study risk of bias assessment', operational_prompt: 'Specify the methods used to assess risk of bias in the included studies, including details of the tool(s) used, how many reviewers assessed each study and whether they worked independently, and if applicable, details of automation tools used in the process.', source_locator: 'bmj.n71/checklist/item-11'}
  - {id: '12', section: 'Methods', topic: 'Effect measures', operational_prompt: 'Specify for each outcome the effect measure(s) (e.g. risk ratio, mean difference) used in the synthesis or presentation of results.', source_locator: 'bmj.n71/checklist/item-12'}
  - {id: '13a', section: 'Methods', topic: 'Synthesis methods', operational_prompt: 'Describe the processes used to decide which studies were eligible for each synthesis (e.g. tabulating the study intervention characteristics and comparing against the planned groups for each synthesis (item #5)).', source_locator: 'bmj.n71/checklist/item-13a'}
  - {id: '13b', section: 'Methods', topic: 'Synthesis methods', operational_prompt: 'Describe any methods required to prepare the data for presentation or synthesis, such as handling of missing summary statistics, or data conversions.', source_locator: 'bmj.n71/checklist/item-13b'}
  - {id: '13c', section: 'Methods', topic: 'Synthesis methods', operational_prompt: 'Describe any methods used to tabulate or visually display results of individual studies and syntheses.', source_locator: 'bmj.n71/checklist/item-13c'}
  - {id: '13d', section: 'Methods', topic: 'Synthesis methods', operational_prompt: 'Describe any methods used to synthesise results and provide a rationale for the choice(s). If meta-analysis was performed, describe the model(s), method(s) to identify the presence and extent of statistical heterogeneity, and software package(s) used.', source_locator: 'bmj.n71/checklist/item-13d'}
  - {id: '13e', section: 'Methods', topic: 'Synthesis methods', operational_prompt: 'Describe any methods used to explore possible causes of heterogeneity among study results (e.g. subgroup analysis, meta-regression).', source_locator: 'bmj.n71/checklist/item-13e'}
  - {id: '13f', section: 'Methods', topic: 'Synthesis methods', operational_prompt: 'Describe any sensitivity analyses conducted to assess robustness of the synthesised results.', source_locator: 'bmj.n71/checklist/item-13f'}
  - {id: '14', section: 'Methods', topic: 'Reporting bias assessment', operational_prompt: 'Describe any methods used to assess risk of bias due to missing results in a synthesis (arising from reporting biases).', source_locator: 'bmj.n71/checklist/item-14'}
  - {id: '15', section: 'Methods', topic: 'Certainty assessment', operational_prompt: 'Describe any methods used to assess certainty (or confidence) in the body of evidence for an outcome.', source_locator: 'bmj.n71/checklist/item-15'}
  - {id: '16a', section: 'Results', topic: 'Study selection', operational_prompt: 'Describe the results of the search and selection process, from the number of records identified in the search to the number of studies included in the review, ideally using a flow diagram (see fig 1).', source_locator: 'bmj.n71/checklist/item-16a'}
  - {id: '16b', section: 'Results', topic: 'Study selection', operational_prompt: 'Cite studies that might appear to meet the inclusion criteria, but which were excluded, and explain why they were excluded.', source_locator: 'bmj.n71/checklist/item-16b'}
  - {id: '17', section: 'Results', topic: 'Study characteristics', operational_prompt: 'Cite each included study and present its characteristics.', source_locator: 'bmj.n71/checklist/item-17'}
  - {id: '18', section: 'Results', topic: 'Risk of bias in studies', operational_prompt: 'Present assessments of risk of bias for each included study.', source_locator: 'bmj.n71/checklist/item-18'}
  - {id: '19', section: 'Results', topic: 'Results of individual studies', operational_prompt: 'For all outcomes, present, for each study: (a) summary statistics for each group (where appropriate) and (b) an effect estimate and its precision (e.g. confidence/credible interval), ideally using structured tables or plots.', source_locator: 'bmj.n71/checklist/item-19'}
  - {id: '20a', section: 'Results', topic: 'Results of syntheses', operational_prompt: 'For each synthesis, briefly summarise the characteristics and risk of bias among contributing studies.', source_locator: 'bmj.n71/checklist/item-20a'}
  - {id: '20b', section: 'Results', topic: 'Results of syntheses', operational_prompt: 'Present results of all statistical syntheses conducted. If meta-analysis was done, present for each the summary estimate and its precision (e.g. confidence/credible interval) and measures of statistical heterogeneity. If comparing groups, describe the direction of the effect.', source_locator: 'bmj.n71/checklist/item-20b'}
  - {id: '20c', section: 'Results', topic: 'Results of syntheses', operational_prompt: 'Present results of all investigations of possible causes of heterogeneity among study results.', source_locator: 'bmj.n71/checklist/item-20c'}
  - {id: '20d', section: 'Results', topic: 'Results of syntheses', operational_prompt: 'Present results of all sensitivity analyses conducted to assess the robustness of the synthesised results.', source_locator: 'bmj.n71/checklist/item-20d'}
  - {id: '21', section: 'Results', topic: 'Reporting biases', operational_prompt: 'Present assessments of risk of bias due to missing results (arising from reporting biases) for each synthesis assessed.', source_locator: 'bmj.n71/checklist/item-21'}
  - {id: '22', section: 'Results', topic: 'Certainty of evidence', operational_prompt: 'Present assessments of certainty (or confidence) in the body of evidence for each outcome assessed.', source_locator: 'bmj.n71/checklist/item-22'}
  - {id: '23a', section: 'Discussion', topic: 'Discussion', operational_prompt: 'Provide a general interpretation of the results in the context of other evidence.', source_locator: 'bmj.n71/checklist/item-23a'}
  - {id: '23b', section: 'Discussion', topic: 'Discussion', operational_prompt: 'Discuss any limitations of the evidence included in the review.', source_locator: 'bmj.n71/checklist/item-23b'}
  - {id: '23c', section: 'Discussion', topic: 'Discussion', operational_prompt: 'Discuss any limitations of the review processes used.', source_locator: 'bmj.n71/checklist/item-23c'}
  - {id: '23d', section: 'Discussion', topic: 'Discussion', operational_prompt: 'Discuss implications of the results for practice, policy, and future research.', source_locator: 'bmj.n71/checklist/item-23d'}
  - {id: '24a', section: 'Other information', topic: 'Registration and protocol', operational_prompt: 'Provide registration information for the review, including register name and registration number, or state that the review was not registered.', source_locator: 'bmj.n71/checklist/item-24a'}
  - {id: '24b', section: 'Other information', topic: 'Registration and protocol', operational_prompt: 'Indicate where the review protocol can be accessed, or state that a protocol was not prepared.', source_locator: 'bmj.n71/checklist/item-24b'}
  - {id: '24c', section: 'Other information', topic: 'Registration and protocol', operational_prompt: 'Describe and explain any amendments to information provided at registration or in the protocol.', source_locator: 'bmj.n71/checklist/item-24c'}
  - {id: '25', section: 'Other information', topic: 'Support', operational_prompt: 'Describe sources of financial or non-financial support for the review, and the role of the funders or sponsors in the review.', source_locator: 'bmj.n71/checklist/item-25'}
  - {id: '26', section: 'Other information', topic: 'Competing interests', operational_prompt: 'Declare any competing interests of review authors.', source_locator: 'bmj.n71/checklist/item-26'}
  - {id: '27', section: 'Other information', topic: 'Availability of data, code, and other materials', operational_prompt: 'Report which of the following are publicly available and where they can be found: template data collection forms; data extracted from included studies; data used for all analyses; analytic code; any other materials used in the review.', source_locator: 'bmj.n71/checklist/item-27'}
